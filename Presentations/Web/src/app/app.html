<main>
      <header class="brand-name">
        <img class="brand-logo" src="/hammer.jpg" alt="logo" aria-hidden="true" />
      </header>
  <section class="mb-4" aria-labelledby="products-heading">
    <app-products></app-products>
  </section>

  <section class="mb-4" aria-labelledby="orders-heading">
    <h2 id="orders-heading" class="h4">Orders</h2>
    <div class="d-flex flex-wrap gap-2">
      <button class="btn btn-primary" type="button" (click)="getOrders()">Get orders</button>
      <button class="btn btn-primary" type="button" (click)="createOrder()">Create order</button>
      <button class="btn btn-primary" type="button" (click)="updateOrder()">Update order</button>
      <button class="btn btn-primary" type="button" (click)="deleteOrder()">Delete order</button>
    </div>
  </section>

  <section class="mb-4" aria-labelledby="shipments-heading">
    <h2 id="shipments-heading" class="h4">Shipments</h2>
    <div class="d-flex flex-wrap gap-2">
      <button class="btn btn-primary" type="button" (click)="getShipments()">Get shipments</button>
      <button class="btn btn-primary" type="button" (click)="createShipment()">Create shipment</button>
      <button class="btn btn-primary" type="button" (click)="updateShipment()">Update shipment</button>
      <button class="btn btn-primary" type="button" (click)="deleteShipment()">Delete shipment</button>
    </div>
  </section>

  <pre class="bg-light border rounded p-3">{{ lastResult() }}</pre>
</main>
