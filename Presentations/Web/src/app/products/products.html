  <h2 id="products-heading" class="h4">Products</h2>
  <section>
    <form>
        <input type="text" placeholder="Filter by name">
        <button class="btn-primary" type="button">Search</button>
    </form>
  </section>
  <section class="results">
    <app-product-names></app-product-names>
  </section>
      @for (product of app.products; track product.Id) {
        <li class="list-group-item">{{ product.Name }} - {{ product.Price | currency }}</li>
      }
    <div class="d-flex flex-wrap gap-2">
      <button class="btn btn-primary" type="button" (click)="app.getProducts()">Get products</button>
      <button class="btn btn-primary" type="button" (click)="app.createProduct()">Create product</button>
      <button class="btn btn-primary" type="button" (click)="app.updateProduct()">Update product</button>
      <button class="btn btn-primary" type="button" (click)="app.deleteProduct()">Delete product</button>
    </div>
